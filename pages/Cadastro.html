            <div class="modal-body">
              <form role="form" class="text-start" id="kpiUpdateForm" data-parsley-validate>


                <!-- <div class="input-group input-group-outline my-3">

                  data-parsley-errors-container="#erroupdatemes" data-parsley-error-message="Campo obrigatório.">
                </div>
                <div class="margin-top10" id="erroupdatemes"></div>-->

                <div class="input-group input-group-outline mb-3">
                  <label class="form-label">Nome</label>
                  <input class="form-control" id="nomeKpi" required data-parsley-length="[5, 255]"
                    data-parsley-errors-container="#erroUpdateNome">
                </div>

                <div class="input-group input-group-outline mb-3">

                </div>
                <div class="margin-top10" id="erroUpdateUnidadeMedida"></div>


                <div class="form-check form-switch d-flex align-items-center mb-3">
                  <input class="form-check-input" type="checkbox" id="statusAlterarKpi" checked>
                  <label class="form-check-label mb-0 ms-2" for="statusInsertKpi">Ativa</label>
                </div>

              </form>

            </div>



            <div class="modal-footer">
              <button type="button" class="btn bg-gradient-secondary mb-2" data-bs-dismiss="modal">Cancelar</button>

  <script>
    $.ajaxSetup({
      beforeSend: function (xhr) {
        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('TokenAutenticacao'));
      },
      error: function (jqXHR, textStatus, errorThrown) {
        if (jqXHR.status == 400) {
          Swal.fire({
            icon: 'warning',
            title: 'Ops!',
            text: jqXHR.responseText
          });
        }
        else if (jqXHR.status == 401) {
          Swal.fire({
            title: 'Sessão expirada!',
            showDenyButton: false,
            showCancelButton: false,
            confirmButtonText: 'Ok'
          }).then((result) => {
            location.href = "sign-in.html";
          });
        }
        else {
          Swal.fire({
            icon: 'error',
            title: 'Ocorreu um erro!',
            text: jqXHR.responseText
          });
        }
      }
    });
  </script>

  <script> // GET LISTA KPIS
    $.ajax({
      method: "GET",
      url: "https://kpisapi.aiur.com.br/v1/ListarKPIs"
    }).done(function (resultado) {
      $(resultado).each(function (index) {
        var statustexto = "";
        if (resultado[index].status) {
          statustexto = "Ativo"
        }
        else {
          statustexto = "Inativo"
        }

        $("#linhastabela").append("<tr>" +
          "<td>" + resultado[index].id + "</td>" +
          "<td>" + resultado[index].nome + "</td>" +
          "<td>" + resultado[index].unidadeMedida + "</td>" +
          "<td>" + statustexto + "</td>" +
          "<td><i data-id=\"" + resultado[index].id + "\" class=\"open-modalUpdate material-icons\" style=\"color: #4254f5; cursor: pointer;\" href=\"#modalUpdate\">edit</i>&emsp;" +
          "<i data-id=\"" + resultado[index].id + "\" class=\"open-modalConfirmarDelete material-icons\" style=\"color: #470000; cursor: pointer;\" href=\"#modalConfirmarDelete\">delete</i></td>" +
          "</tr>"
        );
      });


      tabela = $('#tabelaKpis').DataTable({
        "language": {
          "url": "https://cdn.datatables.net/plug-ins/1.11.4/i18n/pt_br.json"
        }
      });

    })
  </script>

  <script> // GET LISTA KPIS
    function refreshTabela() {
      tabela.destroy();
      $.ajax({
        method: "GET",
        url: "https://kpisapi.aiur.com.br/v1/ListarKPIs"
      }).done(function (resultado) {
        $("#linhastabela").html("")
        $(resultado).each(function (index) {
          var statustexto = "";
          if (resultado[index].status) {
            statustexto = "Ativo"
          }
          else {
            statustexto = "Inativo"
          }

          $("#linhastabela").append("<tr>" +
            "<td>" + resultado[index].id + "</td>" +
            "<td>" + resultado[index].nome + "</td>" +
            "<td>" + resultado[index].unidadeMedida + "</td>" +
            "<td>" + statustexto + "</td>" +
            "<td><i data-id=\"" + resultado[index].id + "\" class=\"open-modalUpdate material-icons\" style=\"color: #4254f5; cursor: pointer;\" href=\"#modalUpdate\">edit</i>&emsp;" +
            "<i data-id=\"" + resultado[index].id + "\" class=\"open-modalConfirmarDelete material-icons\" style=\"color: #470000; cursor: pointer;\" href=\"#modalConfirmarDelete\">delete</i></td>" +
            "</tr>"
          );
        });



        tabela = $('#tabelaKpis').DataTable({
          "language": {
            "url": "https://cdn.datatables.net/plug-ins/1.11.4/i18n/pt_br.json"
          }
        });

      })
    }
  </script>

  <script> // INSERIR KPI
    $("#kpiInsertForm").submit(function (e) {
      e.preventDefault();
      InserirKpi();
    })

    function CriarObjetoInserirKPI() {

      var kpi = {
        nome: $("#nomeInsertKpi").val(),
        unidadeMedida: $("#unidadeMedidaInsertKpi").val(),
        status: true
      };

      if (!($("#statusInsertKpi").is(':checked'))) {
        kpi.status = false;
      }
      console.log($(kpi.nome))
      return kpi;
    }
    function InserirKpi() {

      var objRequisicao = CriarObjetoInserirKPI();
      var jsonRequisicao = JSON.stringify(objRequisicao);
      if ($("#kpiInsertForm").parsley().validate()) {
        $.ajax({
          method: "POST",
          url: "https://kpisapi.aiur.com.br/v1/InserirKPI",
          data: jsonRequisicao,
          contentType: "application/json"
        }).done(function (resultado) {
          console.log(resultado);
          refreshTabela();
          $('#kpiInsertForm')[0].reset();
          $('#modalUpdate').modal('hide');
          Toast.fire({
            icon: 'success',
            title: 'KPI inserida com sucesso!'
          })
        })
      }
    }


  </script>

  <script> // ALTERAR KPI
    $("#kpiAlterar").submit(function (e) {
      e.preventDefault();
      AlterarKpi();
    })

    function CriarObjetoAlterarKPI(idKpi) {

      var kpi = {
        id: idKpi,
        nome: $("#nomeKpi").val(),
        unidadeMedida: $("#unidadeMedidaKpi").val(),
        status: true
      };

      if (!($("#statusAlterarKpi").is(':checked'))) {
        kpi.status = false;
      }
      return kpi;
    }
    function AlterarKpi(idKpi) {

      var objRequisicao = CriarObjetoAlterarKPI(idKpi);
      var jsonRequisicao = JSON.stringify(objRequisicao);
      if ($("#kpiUpdateForm").parsley().validate()) {
        $.ajax({
          method: "PUT",
          url: "https://kpisapi.aiur.com.br/v1/AtualizarKPI",
          data: jsonRequisicao,
          contentType: "application/json"
        }).done(function (resultado) {
          console.log(resultado);
          refreshTabela();
          $('#modalUpdate').modal('hide');
          Toast.fire({
            icon: 'success',
            title: 'KPI atualizada com sucesso!'
          })
        })
      }
    }
  </script>

  <script> // DELETAR KPI
    $("#kpiDeletar").submit(function (e) {
      e.preventDefault();
      DeletarKpi();
    })

    function DeletarKpi(id) {

      $.ajax({
        method: "DELETE",
        url: "https://kpisapi.aiur.com.br/v1/DeletarKPI?id=" + id,
      }).done(function (resultado) {
        console.log(resultado);
        refreshTabela();
        $('#modalConfirmarDelete').modal('hide');
        Toast.fire({
          icon: 'success',
          title: 'KPI deletada com sucesso!'
        })
      })
    }

  </script>

  <script> // SCRIPT PARA PASSAR OS IDS PARA DENTRO DOS MODALS
    $(document).on("click", ".open-modalConfirmarDelete", function () {
      idDelete = $(this).data('id');
      $('#modalConfirmarDelete').modal('show');
    });

    $(document).on("click", ".open-modalUpdate", function () {
      idKpi = $(this).data('id');
      $('#modalUpdate').modal('show');
    });


  </script>

  <script> // SCRIPT TOAST (SWEETALERTS) SUCCESS
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer)
        toast.addEventListener('mouseleave', Swal.resumeTimer)
      }
    })


  </script>

  <script> // SCRIPT PARA LIMPAR LOCALSTORAGE (TOKEN) QUANDO DAR LOGOUT
    $('#botaoLogout').click(function (event) {
      var href = this.href;
      event.preventDefault();
      localStorage.clear();
      window.location = href;
    });
